<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Automation Intern | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #040d1b;
      --surface:   #081a2e;
      --card:      #0c2240;
      --border:    #163a5e;
      --text:      #ffffff;
      --muted:     #a0b8d0;
      --accent:    #4a9eff;
      --accent-lg: #7ab8ff;
      --glow:      rgba(74, 158, 255, .15);
      --radius:    14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-image: linear-gradient(rgba(4, 13, 27, 0.85), rgba(4, 13, 27, 0.85)), url('dana-andreea-gheorghe-1lbKXsSCAhc-unsplash.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: var(--accent-lg); text-decoration: none; transition: color .2s; }
    a:hover { color: #bdd8ff; }

    .blob {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 158, 255, .10), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { top: -150px; left: -100px; }
    .blob-2 {
      bottom: -200px; right: -150px;
      background: radial-gradient(circle, rgba(99, 102, 241, .10), transparent 70%);
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      background: rgba(4, 13, 27, .80);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo {
      font-weight: 800; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-lg));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--muted); font-size: .92rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }

    section {
      position: relative; z-index: 1;
      max-width: 960px; margin: 0 auto;
      padding: 120px 24px 60px;
    }

    .section-label {
      display: inline-block;
      font-size: .75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent-lg);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 2rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 28px;
      color: #ffffff;
    }

    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding-top: 80px;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .82rem; color: var(--muted);
      margin-bottom: 28px;
      background: var(--surface);
    }

    .hero-badge span { color: var(--accent-lg); }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 800; line-height: 1.15;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .hero h1 .gradient {
      background: linear-gradient(135deg, #4a9eff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .hero p {
      max-width: 560px;
      color: var(--muted);
      font-size: 1.08rem;
      margin-bottom: 36px;
    }

    .hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: .95rem; font-weight: 600;
      border: none; cursor: pointer;
      transition: transform .15s, box-shadow .25s;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: linear-gradient(135deg, #4a9eff, #6366f1);
      color: #fff;
      box-shadow: 0 4px 24px var(--glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 32px rgba(99, 102, 241, .35); color: #fff; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-lg); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .about-text { color: var(--muted); font-size: 1rem; }
    .about-text p + p { margin-top: 16px; }
    .about-text strong { color: #ffffff; }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .skill-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .88rem; font-weight: 500;
      color: #ffffff;
      transition: border-color .2s, box-shadow .2s;
    }
    .skill-chip:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--glow);
    }

    .skill-icon {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(74, 158, 255, .12);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: transform .2s, border-color .25s, box-shadow .25s;
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px var(--glow);
    }

    .project-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .72rem; font-weight: 600; letter-spacing: .5px;
      margin-bottom: 16px;
    }
    .tag-python  { background: rgba(56, 189, 248, .12); color: #38bdf8; }
    .tag-ai      { background: rgba(99, 102, 241, .12); color: #a78bfa; }
    .tag-automate{ background: rgba(74, 158, 255, .12); color: #7ab8ff; }

    .project-card h3 { font-size: 1.12rem; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
    .project-card p  { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }

    .project-link { font-size: .85rem; font-weight: 600; color: var(--accent-lg); }
    .project-link:hover { text-decoration: underline; }

    .contact-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      text-align: center;
    }

    .contact-wrapper p { color: var(--muted); max-width: 480px; margin: 0 auto 32px; }

    .contact-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    .contact-form .full { grid-column: 1 / -1; }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .92rem;
      outline: none;
      transition: border-color .2s;
    }
    .contact-form input:focus,
    .contact-form textarea:focus { border-color: var(--accent); }

    .contact-form textarea { resize: vertical; min-height: 120px; }

    .contact-form .btn-primary { justify-self: center; grid-column: 1 / -1; }

    .socials {
      display: flex; gap: 16px; justify-content: center;
      margin-top: 32px;
    }

    .social-link {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      transition: border-color .2s, color .2s;
    }
    .social-link:hover { border-color: var(--accent); color: var(--accent-lg); }

    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 40px 24px;
      font-size: .82rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      nav { padding: 14px 20px; }
      .nav-links { gap: 20px; }
      .about-grid { grid-template-columns: 1fr; }
      .contact-form { grid-template-columns: 1fr; }
      section { padding: 100px 20px 40px; }
    }

    @media (max-width: 480px) {
      .nav-links { display: none; }
      .skills-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2rem; }
    }

    /* 3D Shards Background */
    #shard-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .shard {
      position: absolute;
      background: linear-gradient(135deg, rgba(74, 158, 255, 0.3), rgba(99, 102, 241, 0.1));
      backdrop-filter: blur(2px);
      clip-path: polygon(50% 0%, 100% 25%, 80% 90%, 10% 100%, 0% 40%);
      animation: float-shard infinite linear;
    }

    @keyframes float-shard {
      0% {
        transform: translateY(110vh) rotate3d(1, 1, 1, 0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-20vh) rotate3d(1, 1, 1, 360deg);
        opacity: 0;
      }
    }

  </style>
</head>
<body>
