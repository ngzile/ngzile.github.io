<!DOCTYPE html>
<html lang="en">
<head>

  <title>AI Automation Intern | Portfolio</title>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #04101b; 
      --surface:   #0a1929; 
      --card:      #112538; 
      --border:    #1e3a52; 
      --text:      #e2f0ed; 
      --muted:     #8faebd; 
      --accent:    #10b981; 
      --accent-lg: #34d399; 
      --glow:      rgba(16, 185, 129, .15); 
      --radius:    14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      /* Dark overlay with your Mt. Fuji background */
      background: linear-gradient(rgba(4, 16, 27, 0.85), rgba(4, 16, 27, 0.85)), url('mt-fuji.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: var(--accent-lg); text-decoration: none; transition: color .2s; }
    a:hover { color: #6ee7b7; }

    .blob {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, .12), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { top: -150px; left: -100px; }
    .blob-2 { 
      bottom: -200px; right: -150px; 
      background: radial-gradient(circle, rgba(14, 165, 233, .10), transparent 70%); 
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      background: rgba(10, 10, 15, .75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo {
      font-weight: 800; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-lg));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--muted); font-size: .92rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }

    section {
      position: relative; z-index: 1;
      max-width: 960px; margin: 0 auto;
      padding: 120px 24px 60px;
    }

    .section-label {
      display: inline-block;
      font-size: .75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent-lg);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 2rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 28px;
    }

    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding-top: 80px;
    }

      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
