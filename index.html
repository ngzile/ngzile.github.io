<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Automation Intern | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #04101b; 
      --surface:   #0a1929; 
      --card:      #112538; 
      --border:    #1e3a52; 
      --text:      #e2f0ed; 
      --muted:     #8faebd; 
      --accent:    #10b981; 
      --accent-lg: #34d399; 
      --glow:      rgba(16, 185, 129, .15); 
      --radius:    14px;
    }

    html { scroll-behavior: smooth; }

       body {
      font-family: 'Inter', sans-serif;
      /* Add the dark overlay and the background image here */
      background: linear-gradient(rgba(4, 16, 27, 0.85), rgba(4, 16, 27, 0.85)), url('mt-fuji.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }


    a { color: var(--accent-lg); text-decoration: none; transition: color .2s; }
    a:hover { color: #6ee7b7; }

    .blob {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, .12), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { top: -150px; left: -100px; }
    .blob-2 { 
      bottom: -200px; right: -150px; 
      background: radial-gradient(circle, rgba(14, 165, 233, .10), transparent 70%); 
    }


    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      background: rgba(10, 10, 15, .75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .logo {
      font-weight: 800; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-lg));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { color: var(--muted); font-size: .92rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }

    section {
      position: relative; z-index: 1;
      max-width: 960px; margin: 0 auto;
      padding: 120px 24px 60px;
    }

    .section-label {
      display: inline-block;
      font-size: .75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent-lg);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 2rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 28px;
    }

    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding-top: 80px;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .82rem; color: var(--muted);
      margin-bottom: 28px;
      background: var(--surface);
    }

    .hero-badge span { color: var(--accent-lg); }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 800; line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero h1 .gradient {
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .hero p {
      max-width: 560px;
      color: var(--muted);
      font-size: 1.08rem;
      margin-bottom: 36px;
    }

    .hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: .95rem; font-weight: 600;
      border: none; cursor: pointer;
      transition: transform .15s, box-shadow .25s;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6341e0);
      color: #fff;
      box-shadow: 0 4px 24px var(--glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 32px rgba(124,92,252,.3); color: #fff; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-lg); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .about-text { color: var(--muted); font-size: 1rem; }
    .about-text p + p { margin-top: 16px; }

    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .skill-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .88rem; font-weight: 500;
      transition: border-color .2s, box-shadow .2s;
    }
    .skill-chip:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--glow);
    }

      display: flex; align-items: center; justify-content: c
